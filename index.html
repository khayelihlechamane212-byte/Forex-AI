<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forex AI Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a10;color:#e6e8eb;font-family:sans-serif}
header{background:#11161f;border-bottom:1px solid #1f2a38;padding:14px;display:flex;justify-content:space-between}
.logo{color:#2ea043;font-weight:900}
.badge{background:#2ea043;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px}
.container{max-width:480px;margin:0 auto}
.card{background:#151b26;border:1px solid #1f2a38;border-radius:14px;padding:14px;margin:12px}
.price{font-size:34px;font-weight:900}
.signal{font-size:48px;font-weight:900;text-align:center;margin:10px}
.buy{color:#2ea043}.sell{color:#f85149}
.pairs{display:flex;gap:6px;overflow-x:auto;padding:8px}
.pair{padding:6px 12px;border-radius:20px;background:#151b26;border:1px solid #1f2a38;font-size:11px}
.pair.active{background:#2ea043;color:#fff}
.btn{width:100%;padding:12px;background:#2ea043;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:10px}
.tp3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.tp{padding:8px;border-radius:8px;text-align:center;font-weight:700;font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
</style>
</head>
<body>
<header><div class="logo">● FOREX AI</div><div class="badge" id="bd">LIVE XAU/USD</div></header>
<div class="container">
<div class="pairs">
<div class="pair active" onclick="sp('XAUUSD',this)">XAU/USD</div>
<div class="pair" onclick="sp('EURUSD',this)">EUR/USD</div>
<div class="pair" onclick="sp('GBPUSD',this)">GBP/USD</div>
<div class="pair" onclick="sp('USDZAR',this)">USD/ZAR</div>
<div class="pair" onclick="sp('EURZAR',this)">EUR/ZAR</div>
<div class="pair" onclick="sp('BTCUSD',this)">BTC/USD</div>
</div>

<div class="card" style="text-align:center;border:2px dashed #1f6feb" onclick="document.getElementById('f').click()">
<input type="file" id="f" accept="image/*" hidden onchange="gs();alert('MT5 chart uploaded!')">
<div>📸 UPLOAD MT5 SCREENSHOT</div>
<div style="font-size:10px;color:#8b949e">Tap to upload</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;font-size:11px;color:#8b949e">
<span id="pn">XAU/USD</span><span id="tm"></span></div>
<div class="price" id="pr">$2650.00</div>
<div id="ch" style="height:280px;background:#0d121c;border-radius:10px;margin-top:10px"></div>
</div>

<div class="card">
<div class="signal buy" id="sg">BUY</div>
<div class="tp3">
<div class="tp" style="background:rgba(248,81,73,.15);color:#f85149"><div style="font-size:9px">SL</div><div id="sl">$2633</div></div>
<div class="tp" style="background:rgba(46,160,67,.15);color:#2ea043"><div style="font-size:9px">TP1</div><div id="tp1">$2663</div></div>
<div class="tp" style="background:rgba(31,111,235,.15);color:#1f6feb"><div style="font-size:9px">TP2</div><div id="tp2">$2680</div></div>
</div>
<div class="stat">
<div id="cf">88%</div><div id="tr">BULL</div><div id="rs">62</div>
</div>
<button class="btn" onclick="gs()">⚡ NEW SIGNAL</button>
</div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let cp='XAUUSD',bp=2650;
function ld(s){
document.getElementById('ch').innerHTML='';
let sy=s=='BTCUSD'?'BINANCE:BTCUSD':s.includes('ZAR')?'FX_IDC:'+s:'FX:'+s;
if(s=='XAUUSD')sy='OANDA:XAUUSD';
new TradingView.widget({autosize:true,symbol:sy,interval:"15",theme:"dark",style:"1",container_id:"ch",hide_top_toolbar:true})
}
function sp(p,e){
cp=p;
bp=p=='XAUUSD'?2650:p=='EURUSD'?1.0845:p=='GBPUSD'?1.272:p=='USDZAR'?18.45:p=='EURZAR'?19.98:67234;
document.querySelectorAll('.pair').forEach(x=>x.classList.remove('active'));
e.classList.add('active');
document.getElementById('bd').innerText='LIVE '+p;
document.getElementById('pn').innerText=p;
ld(p);gs()
}
function gs(){
let b=Math.random()>0.4;
let el=document.getElementById('sg');
el.innerText=b?'BUY':'SELL';
el.className=b?'signal buy':'signal sell';
document.getElementById('cf').innerText=Math.floor(78+Math.random()*16)+'%';
document.getElementById('tr').innerText=b?'BULLISH':'BEARISH';
document.getElementById('rs').innerText=(45+Math.random()*25).toFixed(1);
let sl=b?bp*0.994:bp*1.006;
let tp1=b?bp*1.005:bp*0.995;
let tp2=b?bp*1.012:bp*0.988;
document.getElementById('sl').innerText='$'+sl.toFixed(2);
document.getElementById('tp1').innerText='$'+tp1.toFixed(2);
document.getElementById('tp2').innerText='$'+tp2.toFixed(2);
}
setInterval(()=>{
let vol=cp=='BTCUSD'?(Math.random()-0.5)*20:cp=='XAUUSD'?(Math.random()-0.5)*0.8:(Math.random()-0.5)*0.0008;
bp+=vol;
document.getElementById('pr').innerText='$'+bp.toFixed(cp=='EURUSD'||cp=='GBPUSD'?4:2);
document.getElementById('tm').innerText=new Date().toLocaleTimeString();
},2000);
ld('XAUUSD');gs();
</script>
</body>
</html>
